plugins { id 'com.android.application' }

dependencies {
    implementation 'org.opencv:opencv:4.10.0'
}

android {
    namespace 'com.punteriauniversal.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.punteriauniversal.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
